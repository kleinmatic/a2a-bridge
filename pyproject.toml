[project]
name = "a2a-bridge"
# The version comes from the git tag (see [tool.setuptools_scm]).
# There is no version number to edit in this file, and therefore none to
# forget to edit.
dynamic = ["version"]
description = "Connect LibreChat, or any OpenAI-compatible chat client, to any A2A agent."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Scott Klein" }]
keywords = ["a2a", "agent2agent", "librechat", "chat-completions", "agent", "jsonrpc"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.8"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/kleinmatic/a2a-bridge"
Repository = "https://github.com/kleinmatic/a2a-bridge"
Issues = "https://github.com/kleinmatic/a2a-bridge/issues"
Changelog = "https://github.com/kleinmatic/a2a-bridge/releases"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# TRY004 wants TypeError for a failed isinstance check. Here an isinstance
# check means the YAML has the wrong shape, which is a config mistake, not a
# programming error. Every problem in this module raises ValueError so that a
# caller has exactly one exception type to catch.
"src/a2a_bridge/config.py" = ["TRY004"]

[tool.setuptools_scm]
# Building without git metadata -- the Docker image copies src/ and
# pyproject.toml but not .git -- would otherwise raise LookupError and fail
# the build outright. A version is not worth failing a build over.
fallback_version = "0+unknown"
# Tag "v0.2.0" builds version 0.2.0. Building from an untagged commit yields a
# .dev version, which PyPI rejects -- deliberately: only a tag ships.
